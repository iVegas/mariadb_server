# Manual Nyrkiö performance benchmark (replaces the deprecated nyrkio/change-detection action).
#
# Trigger: GitHub UI -> Actions -> "Nyrkiö Benchmark" -> Run workflow.
# Required repo secret: NYRKIO_JWT_TOKEN (nyrkio.com -> user menu -> User Settings).
#
# Two jobs on purpose: "benchmark" builds and runs code from the requested ref
# (possibly a PR from another repo) and gets no secrets; "upload" only POSTs
# the resulting JSON payloads and is the only job that sees NYRKIO_JWT_TOKEN.
#
# Runs on ubuntu-latest by default; for lower-noise results point the
# benchmark job's runs-on at a calibrated self-hosted runner label.
name: Nyrkiö Benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, commit SHA, PR number (123 / #123), or full PR URL (https://github.com/<owner>/<repo>/pull/<N>)"
        type: string
        required: true
      retrospective:
        description: "Benchmark the ref's first-parent history (for initial seeding)"
        type: boolean
        default: false
      retrospective_limit:
        description: "Retrospective: only the newest N commits (1-50; each commit is a full build + bench run)"
        type: number
        default: 20
      full_benchmark:
        description: "Run sql-bench with full limits (default: small test)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout (full history for PR refs + retrospective)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install benchmark dependencies
        # ubuntu 24.04 has no libdbd-mariadb-perl package: build DBD::MariaDB from CPAN
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison libncurses-dev libssl-dev zlib1g-dev \
            libdbi-perl libmariadb-dev cpanminus jq
          sudo cpanm --notest DBD::MariaDB

      - name: Benchmark (payloads only, no upload)
        env:
          REF: ${{ inputs.ref }}
          RETROSPECTIVE: ${{ inputs.retrospective }}
          RETROSPECTIVE_LIMIT: ${{ inputs.retrospective_limit }}
          FULL_BENCHMARK: ${{ inputs.full_benchmark }}
        run: |
          args=(--ref "$REF" --dry-run --out-dir "$RUNNER_TEMP/nyrkio_payloads")
          if [ "$RETROSPECTIVE" = "true" ]; then
            # a hosted job has 6h: the whole history (~10k commits) can never finish
            if [ "$RETROSPECTIVE_LIMIT" -lt 1 ] || [ "$RETROSPECTIVE_LIMIT" -gt 50 ]; then
              echo "::error::retrospective_limit must be between 1 and 50 (got $RETROSPECTIVE_LIMIT)"
              exit 1
            fi
            args+=(--retrospective --limit "$RETROSPECTIVE_LIMIT")
          fi
          if [ "$FULL_BENCHMARK" = "true" ]; then
            args+=(--full)
          fi
          bash scripts/nyrkio_benchmark.sh "${args[@]}"

      - name: Keep payloads
        uses: actions/upload-artifact@v4
        with:
          name: nyrkio-payloads
          path: ${{ runner.temp }}/nyrkio_payloads/*.json
          if-no-files-found: error

  upload:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (upload script only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: nyrkio-payloads
          path: ${{ runner.temp }}/nyrkio_payloads

      - name: Upload to Nyrkiö
        env:
          NYRKIO_JWT_TOKEN: ${{ secrets.NYRKIO_JWT_TOKEN }}
          REF: ${{ inputs.ref }}
        run: bash scripts/nyrkio_benchmark.sh --ref "$REF" --upload "$RUNNER_TEMP/nyrkio_payloads"

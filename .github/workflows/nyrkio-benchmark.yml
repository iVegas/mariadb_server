# Manual Nyrkiö performance benchmark (replaces the deprecated nyrkio/change-detection action).
#
# Trigger: GitHub UI -> Actions -> "Nyrkiö Benchmark" -> Run workflow.
# Required repo secret: NYRKIO_JWT_TOKEN (nyrkio.com -> user menu -> User Settings).
#
# Orchestrator: runs one iteration (nyrkio-benchmark-iteration.yml) and, for a
# retrospective run that is not finished, dispatches itself again with the
# pinned target and the cursor the iteration reported. The history is thus
# benchmarked oldest -> newest as a chain of runs, each inside the 6h job limit.
# Only history the pinned sql-bench supports (10.5.0+) is benchmarked.
#
# Stop a chain: cancel the running orchestrator run before its "next" job fires.
name: Nyrkiö Benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, commit SHA, PR number (123 / #123), or full PR URL (https://github.com/<owner>/<repo>/pull/<N>)"
        type: string
        required: true
      retrospective:
        description: "Benchmark the ref's whole supported history, oldest first, as a chain of runs"
        type: boolean
        default: false
      stride:
        description: "Retrospective: benchmark every Nth first-parent commit (1 = all ~3.5k; each is a rebuild + bench run)"
        type: number
        default: 50
      limit:
        description: "Retrospective: max commits per iteration (0 = only the time budget limits it)"
        type: number
        default: 0
      budget:
        description: "Minutes per iteration after which no new commit is started (hosted job limit is 360)"
        type: number
        default: 240
      full_benchmark:
        description: "Run sql-bench with full limits (default: small test)"
        type: boolean
        default: false
      target:
        description: "Chain state, set by the orchestrator: commit the ref resolved to"
        type: string
        default: ""
      since:
        description: "Chain state, set by the orchestrator: last commit already benchmarked"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  iterate:
    uses: ./.github/workflows/nyrkio-benchmark-iteration.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      target: ${{ inputs.target }}
      since: ${{ inputs.since }}
      retrospective: ${{ inputs.retrospective }}
      stride: ${{ inputs.stride }}
      limit: ${{ inputs.limit }}
      budget: ${{ inputs.budget }}
      full_benchmark: ${{ inputs.full_benchmark }}

  next:
    needs: iterate
    if: inputs.retrospective && needs.iterate.outputs.done == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # dispatch the next orchestrator run (GITHUB_TOKEN dispatches are allowed to trigger runs)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: ${{ inputs.ref }}
      STRIDE: ${{ inputs.stride }}
      LIMIT: ${{ inputs.limit }}
      BUDGET: ${{ inputs.budget }}
      FULL_BENCHMARK: ${{ inputs.full_benchmark }}
      TARGET: ${{ needs.iterate.outputs.target }}
      SINCE: ${{ needs.iterate.outputs.next_since }}
    steps:
      - name: Dispatch the next iteration
        run: |
          gh workflow run nyrkio-benchmark.yml --ref "$GITHUB_REF_NAME" \
            -f ref="$REF" -f retrospective=true -f stride="$STRIDE" -f limit="$LIMIT" \
            -f budget="$BUDGET" -f full_benchmark="$FULL_BENCHMARK" \
            -f target="$TARGET" -f since="$SINCE"
